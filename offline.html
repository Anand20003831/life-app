<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Life · offline</title>
  <style>
    :root { --bg: #f5f5f5; --card: #fff; --ink: #171717; --muted: #636363; --line: #e5e5e5; --accent: #3352c0; --accent-ink: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0f0f; --card: #1a1a1a; --ink: #ececec; --muted: #a3a3a3; --line: #2a2a2a; --accent: #9db1ea; --accent-ink: #111; } }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 22vh 24px 24px; text-align: center; }
    svg { width: 48px; height: 48px; color: var(--muted); }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { font: 600 15px/1 system-ui, sans-serif; min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 4.5-2.8M10 5.1A15 15 0 0 1 22 8.5"/><path d="M5 12.5a10 10 0 0 1 3.6-2.2M13.5 10a10 10 0 0 1 5.5 2.5"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h0"/><path d="M3 3l18 18"/></svg>
    <h1>You're offline</h1>
    <p>Life couldn't load just now. Once it has opened with a connection, it works offline with what was saved.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
